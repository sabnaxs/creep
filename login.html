<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- =====================================================
         CONFIGURAÇÕES BÁSICAS
         ===================================================== -->

    <meta charset="UTF-8">

    <!-- Faz a página se adaptar ao celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nome que aparece na aba do navegador -->
    <title>Cadastro | Swan Into Pages</title>


    <!-- =====================================================
         FONTES
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ARQUIVO CSS
         ===================================================== -->

    <link rel="stylesheet" href="ESTILO.CSS">

</head>


<body>


    <!-- =====================================================
         RENDA DECORATIVA DO TOPO
         ===================================================== -->

       <div class="lace-top"></div>



    <!-- =====================================================
         PÁGINA PRINCIPAL
         ===================================================== -->

    <main class="pagina">


        <!-- =================================================
             CABEÇALHO
             ================================================= -->

        <header>


            

       

            
            <h1>Swan Into Pages</h1>



            <p> entre páginas, sonhos e histórias</p>


      


        
        </header>



        <!-- =================================================
             CAIXA DE CADASTRO
             ================================================= -->

        <section class="caixa-cadastro">


            <!-- TÍTULO -->

            <h1>
                Crie sua conta
            </h1>


            <!-- DESCRIÇÃO -->

            <p class="descricao">

                Faça parte do nosso pequeno cantinho literário
                e desbloqueie as resenhas completas.

            </p>



            <!-- =================================================
                 FORMULÁRIO
                 ================================================= -->

            <form action="resenhas2.html" method="get">




                <!-- ==============================
                     USUÁRIO
                     ============================== -->

                <div class="campo">

                    <label for="usuario">
                        Nome de usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="@seuusuario"
                        required
                    >

                </div>



        



                <!-- ==============================
                     SENHA
                     ============================== -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>






                <!-- ==============================
                     BOTÃO
                     ============================== -->

                <button
                    type="submit"
                    class="botao"
                >

                   Entrar na minha conta

                </button>


            </form>





        </section>


    </main>



    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer>

        <p>
            Swan Into Pages
        </p>

        <p>
            made for readers
        </p>

    </footer>



    <!-- =====================================================
         RENDA DECORATIVA INFERIOR
         ===================================================== -->

    <div class="lace-bottom"></div>


</body>

</html>
